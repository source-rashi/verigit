name: Render VHS demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check out repository (full history for git stats)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Link CLI for the tape
        run: npm link

      - name: Render digest demo with VHS
        uses: charmbracelet/vhs-action@v2.1.1
        with:
          path: demos/digest.tape

      - name: Upload demo GIF
        uses: actions/upload-artifact@v4
        with:
          name: verigit-digest-demo
          path: demos/digest.gif
          if-no-files-found: error
          retention-days: 14
